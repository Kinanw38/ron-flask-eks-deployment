name: Build and Deploy to EKS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'flask-chart/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: [ "Terraform Infrastructure" ]
    types: [ completed ]
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run after a successful Terraform workflow, or on direct push to app/chart paths
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Verify ECR repository exists
      run: |
        aws ecr describe-repositories --repository-names ron-eks-mission-repo --region us-east-1 \
          || (echo "::error::ECR repo not found. Run Terraform Infrastructure workflow first (terraform apply)." && exit 1)

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ron-eks-mission-repo
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Update kube config
      run: aws eks update-kubeconfig --region us-east-1 --name ron-eks-mission

    - name: Deploy to EKS using Helm
      run: |
        helm upgrade --install my-flask-app ./flask-chart \
          --set image.repository=${{ steps.login-ecr.outputs.registry }}/ron-eks-mission-repo \
          --set image.tag=latest
