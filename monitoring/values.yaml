# Bonus 2: kube-prometheus-stack (Prometheus + Grafana)
# Tuned down for small EKS / free-tier style clusters

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: LoadBalancer

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
